{% extends "base.html" %}
{% block title %}{% if modo == 'editar' %}Editar cliente{% else %}Nuevo cliente{% endif %}{% endblock %}
{% block heading %}{% if modo == 'editar' %}Editar cliente{% else %}Registrar cliente{% endif %}{% endblock %}
{% block content %}
<article class="card form-card">
    <form method="post" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-grid">
            <label class="full">Nombre completo *
                <input type="text" name="nombre" required maxlength="100" value="{{ cliente.nombre if cliente else '' }}">
            </label>
            <label>Correo electrónico *
                <input type="email" name="email" required maxlength="100" value="{{ cliente.email if cliente else '' }}">
            </label>
            <label>Teléfono *
                <input type="tel" name="telefono" required maxlength="20" value="{{ cliente.telefono if cliente else '' }}">
            </label>
            <label class="full">Dirección *
                <input type="text" name="direccion" required maxlength="150" value="{{ cliente.direccion if cliente else '' }}">
            </label>
            <label>Ciudad *
                <input type="text" name="ciudad" required maxlength="50" value="{{ cliente.ciudad if cliente else '' }}">
            </label>
            <label>País (nacionalidad) *
                <select name="pais" required>
                    <option value="">Seleccione</option>
                    {% set pais_actual = cliente.pais if cliente else 'Colombia' %}
                    {% for pais in paises %}
                    <option value="{{ pais }}" {% if pais_actual == pais %}selected{% endif %}>{{ pais }}</option>
                    {% endfor %}
                </select>
            </label>
        </div>
        <div class="form-actions">
            <a class="btn btn-ghost" href="{{ url_for('clientes.lista') }}">Cancelar</a>
            <button class="btn btn-primary" type="submit"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
        </div>
    </form>
</article>
{% endblock %}
